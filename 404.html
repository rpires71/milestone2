<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Holiday Destination Finder</title>
  
  <!-- Automatic redirect after 3 seconds -->
  <meta http-equiv="refresh" content="3; url=packages.html">
  
  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Google Fonts - Montserrat & Lato -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Lato:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  
  <style>
    body {
      font-family: 'Lato', sans-serif;
    }
    
    .error-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(135deg, #1a5276 0%, #2980b9 100%);
      color: white;
    }
    
    .error-code {
      font-family: 'Montserrat', sans-serif;
      font-size: 8rem;
      font-weight: 700;
      margin-bottom: 0;
    }
    
    .error-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    
    .error-message {
      font-family: 'Lato', sans-serif;
      font-size: 1.1rem;
      margin-bottom: 2rem;
      opacity: 0.9;
    }
    
    .btn-home {
      font-family: 'Montserrat', sans-serif;
      background-color: white;
      color: #1a5276;
      padding: 12px 30px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-block;
    }
    
    .btn-home:hover {
      background-color: #f8f9fa;
      color: #1a5276;
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    
    .redirect-notice {
      font-family: 'Lato', sans-serif;
      margin-top: 2rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }
    
    .error-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.9;
    }
    
    /* Responsive adjustments */
    @media (max-width: 576px) {
      .error-code {
        font-size: 5rem;
      }
      .error-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="container">
      <i class="bi bi-exclamation-triangle-fill error-icon"></i>
      <h1 class="error-code">404</h1>
      <h2 class="error-title">Oops! Page not found</h2>
      <p class="error-message">The page you're looking for doesn't exist or has been moved.</p>
      <a href="packages.html" class="btn-home">
        <i class="bi bi-house-fill me-2"></i>Go to Packages
      </a>
      <p class="redirect-notice">
        <i class="bi bi-clock me-1"></i>
        You will be automatically redirected in <span id="countdown">3</span> seconds...
      </p>
    </div>
  </div>

  <script>
    // Countdown timer
    let seconds = 3;
    const countdownEl = document.getElementById('countdown');
    
    const interval = setInterval(function() {
      seconds--;
      countdownEl.textContent = seconds;
      
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = 'packages.html';
      }
    }, 1000);
  </script>
</body>
</html>
